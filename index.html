<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevToolbox - Herramientas para desarrolladores</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>DevToolbox</h1>
            <p>Herramientas gratuitas para desarrolladores</p>
        </div>
    </header>

    <main class="container">

        <section class="hero">
            <h2>Developer Tools</h2>
            <p>
                Herramientas simples, rápidas y gratuitas para facilitar
                tu trabajo como desarrollador.
            </p>
        </section>

        <section class="tools-section">
            <h2>Herramientas</h2>

            <div class="tools-grid">

                <article class="tool-card">
                    <h3>JSON Toolkit</h3>

                    <p>
                        Formatea, valida y analiza JSON de forma rápida.
                    </p>

                    <a href="#" class="tool-button">
                        Abrir herramienta
                    </a>
                </article>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 DevToolbox</p>
        </div>
    </footer>

    <script src="js/main.js"></script>

</body>
</html>
